# Domain Causal Dependency Graph for Order Execution Build
config_version: "1.0.0"

nodes:
  - id: "E1"
    name: "Improve Sales Forecast Accuracy"
    stage: "Sales Forecasting"
  - id: "E2"
    name: "Minimize Forecast Variance"
    stage: "Sales Forecasting"
  - id: "E3"
    name: "Reduce Stockouts"
    stage: "Demand Planning"
  - id: "E4"
    name: "Reduce Delivery Lead Time"
    stage: "Demand Planning"
  - id: "E5"
    name: "Reduce Margin Leakage"
    stage: "Demand Planning"
  - id: "E6"
    name: "Reduce Inbound Defect Risk"
    stage: "Demand Planning"
  - id: "E7"
    name: "Reduce Purchase Cost"
    stage: "Procurement"
  - id: "E8"
    name: "Reduce Inventory Stockout Risk"
    stage: "Procurement"
  - id: "E9"
    name: "Reduce Single-Source Supply Risk"
    stage: "Procurement"
  - id: "E10"
    name: "Reduce Non-Compliant PO Risk Rate"
    stage: "Procurement"

edges:
  # E1 Causal Linkages
  - cause: "E2"
    effect: "E1"
    mechanism: "High forecast variance and month-end demand volatility degrades underlying baseline sales forecasting accuracy."
  - cause: "E4"
    effect: "E1"
    mechanism: "Replenishment transit lead time jitter obscures point-of-sale inventory cadence, misleading demand forecasting algorithms."
  - cause: "E1"
    effect: "E8"
    mechanism: "Under-forecasted sales demand rapidly depletes forward warehouse inventory coverage, triggering premature reorders."
  - cause: "E1"
    effect: "E3"
    mechanism: "Under-forecasted sales demand generates insufficient stock replenishment, causing stockout breaches."
  - cause: "E1"
    effect: "E5"
    mechanism: "Demand forecasting errors force emergency spot-market logistics expediting, causing gross margin leakage."

  # E2 Causal Linkages
  - cause: "E1"
    effect: "E2"
    mechanism: "Sales demand forecast errors and erratic ordering amplify month-end forecast variance."
  - cause: "E4"
    effect: "E2"
    mechanism: "Transit lead-time instability forces warehouse defensive buffering, elevating forecast error."
  - cause: "E2"
    effect: "E8"
    mechanism: "Volatile demand forecast oscillations force aggressive, premature safety stock reorders."
  - cause: "E2"
    effect: "E5"
    mechanism: "Forecast variance triggers emergency inter-facility balancing transfers and gross margin leakage."

  # E3 Causal Linkages
  - cause: "E4"
    effect: "E3"
    mechanism: "Transit lead-time delays deplete distribution center safety buffers, triggering customer stockouts."
  - cause: "E9"
    effect: "E3"
    mechanism: "Single-source vendor dependency leaves regional warehouses without secondary replenishment, triggering stockouts."
  - cause: "E3"
    effect: "E8"
    mechanism: "Severe customer stockouts accelerate emergency replenishment reorders across distribution centers."
  - cause: "E3"
    effect: "E5"
    mechanism: "Unfulfilled orders and expedited emergency shipments erode gross margin through SLA penalties and freight fees."

  # E4 Causal Linkages
  - cause: "E9"
    effect: "E4"
    mechanism: "Lack of backup supplier allocation forces reliance on delayed primary vendor transit routes."
  - cause: "E6"
    effect: "E4"
    mechanism: "High inbound defect inspection rejections require vendor reshipments, extending fulfillment lead time."
  - cause: "E4"
    effect: "E8"
    mechanism: "Extended fulfillment lead time increases safety reorder frequency requirements across warehouses."
  - cause: "E4"
    effect: "E5"
    mechanism: "Extended transit lead times trigger premium expediting air-freight fees and contractual SLA chargebacks."

  # E5 Causal Linkages
  - cause: "E7"
    effect: "E5"
    mechanism: "Inbound purchase price variance directly compresses realized product gross margins."
  - cause: "E10"
    effect: "E5"
    mechanism: "Purchase order terms non-compliance results in lost prompt-payment discounts and reconciliation penalties."
  - cause: "E5"
    effect: "E8"
    mechanism: "Margin leakage constraints restrict procurement working capital, destabilizing safety stock reorders."

  # E6 Causal Linkages
  - cause: "E9"
    effect: "E6"
    mechanism: "Single-source supplier dependency leads to unmonitored vendor quality drift and inbound defect spikes."
  - cause: "E10"
    effect: "E6"
    mechanism: "Off-contract spot purchasing from unverified vendors increases inbound component defect rates."
  - cause: "E6"
    effect: "E8"
    mechanism: "Defective shipment quarantine holds starve warehouse inventory, forcing urgent replacement reorders."
  - cause: "E6"
    effect: "E5"
    mechanism: "Defect inspection rework, return logistics, and vendor chargeback disputes erode product gross margin."

  # E7 Causal Linkages
  - cause: "E10"
    effect: "E7"
    mechanism: "Non-compliant and rogue off-contract purchase orders eliminate volume pricing discounts, raising procurement cost."
  - cause: "E9"
    effect: "E7"
    mechanism: "Single-source supplier monopoly pricing power inflates contract unit purchase costs."
  - cause: "E7"
    effect: "E8"
    mechanism: "Elevated purchasing costs restrict purchase order batch sizing, destabilizing warehouse inventory buffers."

  # E8 Causal Linkages
  - cause: "E8"
    effect: "E3"
    mechanism: "Safety buffer depletion breaches minimum threshold, directly causing customer stockout events."
  - cause: "E8"
    effect: "E5"
    mechanism: "Buffer exhaustion forces expensive emergency split-shipments, eroding product margin."

  # E9 Causal Linkages
  - cause: "E10"
    effect: "E9"
    mechanism: "PO non-compliance and procurement consolidation deepen single-source vendor reliance."
  - cause: "E7"
    effect: "E9"
    mechanism: "Volume tiering and bulk discount pursuit consolidates purchasing with sole-source vendors."
  - cause: "E9"
    effect: "E8"
    mechanism: "Single-source supply constraints deplete warehouse safety stock buffers."

  # E10 Causal Linkages
  - cause: "E9"
    effect: "E10"
    mechanism: "Sole-source vendors dictate non-standard delivery and billing terms, driving PO non-compliance."
  - cause: "E10"
    effect: "E4"
    mechanism: "Purchase order terms discrepancies hold shipments at receiving docks, adding lead-time delay."

validation_rules:
  min_spearman_corr: 0.20
  min_partial_corr: 0.18
  p_value_threshold: 0.05
  min_shared_driver_overlap: 1
